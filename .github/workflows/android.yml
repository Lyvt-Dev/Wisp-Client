name: android
# The Wisp phone app (packaging/android, crates/wisp-android): builds the APK on every change to
# what goes into it; publishes it as the android-v<version> release from main, or when run by
# hand with "publish" on.
on:
  push:
    paths: ['crates/**', 'third_party/**', 'packaging/android/**', 'Cargo.toml', 'Cargo.lock', 'launcher/Cargo.toml', '.github/workflows/android.yml']
  pull_request:
    paths: ['crates/**', 'third_party/**', 'packaging/android/**', 'Cargo.toml', 'Cargo.lock', 'launcher/Cargo.toml', '.github/workflows/android.yml']
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the APK as a GitHub release
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      NDK_VERSION: 27.2.12479018
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target/android
          cache-on-failure: true
      - name: Android NDK, platform and build tools
        run: |
          sudo apt-get update && sudo apt-get install -y ninja-build
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK_VERSION" "platforms;android-35" "build-tools;35.0.0" >/dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
      - name: Phone link and phone setup tests
        run: cargo test --locked -p wisp-phone-link
      - name: Signing key
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_BASE64: ${{ secrets.WISP_ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/wisp-release.jks"
            echo "WISP_ANDROID_KEYSTORE=$RUNNER_TEMP/wisp-release.jks" >> "$GITHUB_ENV"
          fi
      - name: Build the APK
        env:
          WISP_ANDROID_KEYSTORE_PASS: ${{ secrets.WISP_ANDROID_KEYSTORE_PASS }}
          WISP_ANDROID_KEY_ALIAS: ${{ secrets.WISP_ANDROID_KEY_ALIAS }}
        run: packaging/android/build-apk.sh --profile release --out dist/android
      - uses: actions/upload-artifact@v4
        with:
          name: wisp-android
          path: dist/android/*
  publish:
    needs: apk
    if: github.repository == 'Lyvt-Dev/Wisp-Client' && (github.event_name == 'push' && github.ref == 'refs/heads/main' || inputs.publish)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: wisp-android-release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: wisp-android
          path: dist/android
      - name: Publish android-v<version>
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' launcher/Cargo.toml | head -1)"
          tag="android-v$version"
          notes="packaging/android/releases/$version.md"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "$tag is already published; its assets are kept as they are."
            exit 0
          fi
          ls dist/android/*-debug.apk >/dev/null 2>&1 && { echo "No release key: not publishing a debug-signed APK."; exit 1; }
          gh release create "$tag" dist/android/* --target "$GITHUB_SHA" \
            --title "Wisp for Android $version" --notes-file "$notes"
