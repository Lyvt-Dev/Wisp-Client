[package]
name = "cargo-wisp-mod"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version = "1.86"
description = "cargo wisp-mod new/build/run/check: make Wisp content mods (docs/mods.md)"

# `cargo binstall --git https://github.com/Lyvt-Dev/Wisp-Client cargo-wisp-mod` (#2120) reads this: the archive
# `cargo-wisp-mod`'s workflow attaches to the `cargo-wisp-mod-v<version>` release for the runner's target,
# holding the binary at its root. tools/wisp_mod_binstall.py expands it for the workflow's targets.
[package.metadata.binstall]
pkg-url = "https://github.com/Lyvt-Dev/Wisp-Client/releases/download/cargo-wisp-mod-v{ version }/{ name }-{ target }.tar.gz"
bin-dir = "{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[dependencies]
wisp-compat = { path = "../wisp-compat" }
wisp-mods = { path = "../wisp-mods", default-features = false, features = ["index"] }
serde_json = "1.0.151"

[dev-dependencies]
zip = { version = "9.1.3", default-features = false, features = ["deflate"] }

[lints]
workspace = true
