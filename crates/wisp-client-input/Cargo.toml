[package]
name = "wisp-client-input"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version = "1.90"
description = "The client's input layer: key bindings and their names, mouse, controllers, clipboard and window options"

[dependencies]
wisp-compat = { path = "../wisp-compat" }
wisp-client-core = { path = "../wisp-client-core" }
winit = "0.30.13"
# The window icon.
wisp-theme = { path = "../wisp-theme" }
png = "0.18"
arboard = { version = "3.6.1", default-features = false, features = ["wayland-data-control"] }
# The DualSense's trigger effects (the `controllers` feature).
wisp-dualsense = { path = "../wisp-dualsense", optional = true }

[features]
controllers = ["dep:wisp-dualsense"]

[lints]
workspace = true
