[package]
name = "wisp-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Wisp simulation foundations for the pinned vanilla Java Edition target"

[features]
# Records the call sites of LegacyRandom draws (mob AI parity debugging).
rng-trace = []

[dependencies]
wisp-compat = { path = "../wisp-compat" }
libm = "=0.2.16"

[[bin]]
name = "wisp-parity"
path = "src/bin/parity.rs"

[[bin]]
name = "wisp-tick-parity"
path = "src/bin/tick_parity.rs"

[[bin]]
name = "wisp-geometry-parity"
path = "src/bin/geometry_parity.rs"

[[bin]]
name = "wisp-noise-parity"
path = "src/bin/noise_parity.rs"

[[bin]]
name = "wisp-density-parity"
path = "src/bin/density_parity.rs"

[[bin]]
name = "wisp-float-log-parity"
path = "src/bin/float_log_parity.rs"

[lints]
workspace = true
